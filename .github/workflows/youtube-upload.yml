name: YouTube-Upload

# Startet, sobald ein Auftrag in queue/ abgelegt wird. Die Zugangsdaten liegen als Secrets im Repository
# (Settings > Secrets and variables > Actions): YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN.
on:
  push:
    branches: [main]
    paths: ['queue/*.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Auftraege und Skript holen
        uses: actions/checkout@v4
      - name: Zu YouTube hochladen
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 tools/yt_queue.py
      - name: Ergebnis sichern
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git diff --cached --quiet || (git commit -q -m "Upload-Ergebnis" && git pull -q --rebase origin main && git push -q origin HEAD:main)
